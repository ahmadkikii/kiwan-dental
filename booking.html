<main>

  <section class="booking-page-section">

        </p>

        <div class="form-group">
          <label>الاسم الكامل:</label>

          <input
            type="text"
            id="visitorName"
            placeholder="أدخل اسمك الكريم">
        </div>

        <div class="form-group">
          <label>رقم الهاتف:</label>

          <input
            type="tel"
            id="visitorPhone"
            placeholder="مثال: 0956766617">
        </div>

        <div class="form-group">
          <label>تاريخ الموعد:</label>

          <input
            type="date"
            id="visitorDate">
        </div>

        <div class="form-group">

          <label>اختر الساعة:</label>

          <select id="visitorHour">

            <option value="">
              اختر ساعة الدوام
            </option>

            <option value="09">
              09:00 صباحاً
            </option>

            <option value="10">
              10:00 صباحاً
            </option>

            <option value="11">
              11:00 صباحاً
            </option>

            <option value="12">
              12:00 ظهراً
            </option>

            <option value="13">
              01:00 ظهراً
            </option>

            <option value="14">
              02:00 عصراً
            </option>

            <option value="15">
              03:00 عصراً
            </option>

            <option value="16">
              04:00 عصراً
            </option>

          </select>

        </div>

        <div class="form-group">

          <label>سبب الزيارة:</label>

          <input
            type="text"
            id="visitorNote"
            placeholder="مثال: كشف دوري">

        </div>

        <button
          class="booking-btn"
          id="bookingButton"
          onclick="sendBookingRequest()">

          تثبيت وإرسال حجز الموعد

        </button>

<script>

  /* =========================================================
     Google Apps Script الجديد
     ========================================================= */

  const scriptUrl =
    "https://script.google.com/macros/s/AKfycbyT7rO0ZWXN710VSifNA6eRAOuMOjN3ix6rFLAVFwC-atXWe5MHk3XKUIBuUTRRjue2/exec";


  /* =========================================================
     ملف الأوقات المغلقة
     ========================================================= */

  const blockedTimesUrl =
    "https://raw.githubusercontent.com/ahmadkikii/kiwan-dental/main/assets/blocked-times.json";


  /* =========================================================
     تاريخ اليوم بالتوقيت المحلي
     ========================================================= */

  function getLocalDateString() {

    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      String(now.getMonth() + 1).padStart(2, '0');

    const day =
      String(now.getDate()).padStart(2, '0');

    return `${year}-${month}-${day}`;
  }


  const todayStr =
    getLocalDateString();


  document
    .getElementById('visitorDate')
    .setAttribute('min', todayStr);


  /* =========================================================
     تحميل الأوقات المغلقة
     ========================================================= */

  async function loadBlockedTimes() {

    try {

      const response =
        await fetch(
          blockedTimesUrl + "?v=" + Date.now(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {
        return [];
      }


      const data =
        await response.json();


      if (Array.isArray(data)) {
        return data;
      }


      return [];

    } catch (error) {

      return [];

    }

  }


  /* =========================================================
     التحقق من الوقت المغلق
     ========================================================= */

  function isTimeBlocked(
    blockedTimes,
    dateInput,
    hourInput
  ) {

    if (!Array.isArray(blockedTimes)) {
      return false;
    }


    return blockedTimes.some(function(item) {

      return (
        item &&
        item.date === dateInput &&
        Array.isArray(item.hours) &&
        item.hours.includes(hourInput)
      );

    });

  }


  /* =========================================================
     إرسال الحجز
     ========================================================= */

  async function sendBookingRequest() {

    const name =
      document
        .getElementById('visitorName')
        .value
        .trim();


    const phone =
      document
        .getElementById('visitorPhone')
        .value
        .trim();


    const dateInput =
      document
        .getElementById('visitorDate')
        .value;


    const hourInput =
      document
        .getElementById('visitorHour')
        .value;


    const note =
      document
        .getElementById('visitorNote')
        .value
        .trim();


    const msgDiv =
      document.getElementById('booking-msg');


    const bookingButton =
      document.getElementById('bookingButton');


    /* =====================================================
       التحقق من الحقول
       ===================================================== */

    if (
      !name ||
      !phone ||
      !dateInput ||
      !hourInput
    ) {

      msgDiv.style.color = "red";

      msgDiv.innerText =
        "الرجاء تعبئة كافة الحقول.";

      return;

    }


    /* =====================================================
       منع التاريخ الماضي
       ===================================================== */

    if (dateInput < todayStr) {

      msgDiv.style.color = "red";

      msgDiv.innerText =
        "عذراً، لا يمكن الحجز في تاريخ سابق.";

      return;

    }


    /* =====================================================
       منع الساعات الماضية في نفس اليوم
       ===================================================== */

    if (dateInput === todayStr) {

      const currentHour =
        new Date().getHours();


      if (
        parseInt(hourInput, 10) <= currentHour
      ) {

        msgDiv.style.color = "red";

        msgDiv.innerText =
          "عذراً، لا يمكن الحجز في وقت مضى من اليوم الحالي.";

        return;

      }

    }


    /* =====================================================
       منع يوم الجمعة
       ===================================================== */

    const selectedDate =
      new Date(
        dateInput + "T12:00:00"
      );


    if (selectedDate.getDay() === 5) {

      msgDiv.style.color = "red";

      msgDiv.innerText =
        "عذراً، العيادة مغلقة يوم الجمعة.";

      return;

    }


    /* =====================================================
       فحص الأوقات المغلقة
       ===================================================== */

    msgDiv.style.color = "#03263b";

    msgDiv.innerText =
      "جاري التحقق من الموعد...";


    const blockedTimes =
      await loadBlockedTimes();


    if (
      isTimeBlocked(
        blockedTimes,
        dateInput,
        hourInput
      )
    ) {

      msgDiv.style.color = "red";

      msgDiv.innerText =
        "عذراً، هذا الوقت مغلق للحجز من قبل العيادة.";

      return;

    }


    /* =====================================================
       إنشاء وقت الحجز
       ===================================================== */

    const timeInput =
      dateInput + " " + hourInput + ":00";


    /* =====================================================
       تعطيل الزر مؤقتاً
       ===================================================== */

    bookingButton.disabled = true;

    bookingButton.innerText =
      "جاري تثبيت الحجز...";


    msgDiv.style.color = "#03263b";

    msgDiv.innerText =
      "جاري تثبيت الموعد...";


    try {

      /* ===================================================
         جلب المواعيد الحالية من Google Sheets
         =================================================== */

      const response =
        await fetch(
          scriptUrl + "?v=" + Date.now(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "تعذر الاتصال بجدول المواعيد"
        );

      }


      const bookedTimes =
        await response.json();


      /* ===================================================
         التأكد أن الموعد غير محجوز
         =================================================== */

      if (
        Array.isArray(bookedTimes) &&
        bookedTimes.includes(timeInput)
      ) {

        msgDiv.style.color = "red";

        msgDiv.innerText =
          "عذراً، هذا الموعد محجوز مسبقاً.";

        bookingButton.disabled = false;

        bookingButton.innerText =
          "تثبيت وإرسال حجز الموعد";

        return;

      }


      /* ===================================================
         إرسال الحجز إلى Google Apps Script
         
         مهم:
         نستخدم text/plain بدل application/json
         حتى لا يحدث CORS Preflight مع Google Apps Script.
         =================================================== */

      const bookingData = {

        name: name,

        phone: phone,

        time: timeInput,

        note: note

      };


      await fetch(
        scriptUrl,
        {

          method: "POST",

          mode: "no-cors",

          redirect: "follow",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(bookingData)

        }
      );


      /* ===================================================
         نجاح الحجز
         =================================================== */

      msgDiv.style.color = "green";

      msgDiv.innerText =
        "تم حجز موعدك بنجاح وسنؤكد لك قريباً!";


      /* ===================================================
         تفريغ الحقول
         =================================================== */

      document
        .getElementById('visitorName')
        .value = "";


      document
        .getElementById('visitorPhone')
        .value = "";


      document
        .getElementById('visitorDate')
        .value = "";


      document
        .getElementById('visitorHour')
        .value = "";


      document
        .getElementById('visitorNote')
        .value = "";


    } catch (err) {

      console.error(err);

      msgDiv.style.color = "red";

      msgDiv.innerText =
        "حدث خطأ أثناء إرسال الحجز، يرجى المحاولة لاحقاً.";

    }


    /* =====================================================
       إعادة تفعيل الزر
       ===================================================== */

    bookingButton.disabled = false;

    bookingButton.innerText =
      "تثبيت وإرسال حجز الموعد";

  }

</script>
