<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03263b">
  <title>حجز موعد - عيادة كيوان لطب الأسنان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .booking-section { padding: 60px 20px; background: #fdfbf7; min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .booking-card { width: 100%; max-width: 600px; background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .booking-card h2 { color: #03263b; margin-bottom: 25px; text-align: center; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 1rem; box-sizing: border-box; direction: rtl; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #03263b; outline: none; }
    .btn-submit { width: 100%; padding: 15px; background: #03263b; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; font-family: 'Cairo', sans-serif; }
    .btn-submit:hover { background: #054a73; }
    #message-box { display: none; text-align: center; padding: 30px; background: #d4edda; color: #155724; border-radius: 8px; margin-top: 20px; font-size: 1.1rem; line-height: 1.8; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">
      <span class="brand-text"><strong>عيادة كيوان</strong><small>لطب الأسنان</small></span>
      <span class="tooth-logo" aria-hidden="true">♡</span>
    </a>
    <a href="index.html" class="btn btn-outline" style="padding: 8px 20px; font-size: 0.9rem;">الرئيسية ←</a>
  </div>
</header>

<main class="booking-section">
  <div class="booking-card">
    <h2>حجز موعد جديد في العيادة</h2>
    <form id="bookingForm">
      
      <div class="form-group">
        <label>الاسم الكامل *</label>
        <input type="text" id="patientName" required placeholder="أدخل اسمك الثلاثي">
      </div>

      <div class="form-group">
        <label>سنة الميلاد *</label>
        <input type="number" id="birthYear" required min="1920" max="2026" placeholder="مثال: 1990">
      </div>

      <div class="form-group">
        <label>رقم الموبايل (يُفضل وجود واتساب) *</label>
        <input type="tel" id="phoneNumber" required placeholder="09xxxxxxxx">
      </div>

      <div class="form-group">
        <label>الشكوى الرئيسية *</label>
        <textarea id="mainComplaint" required rows="3" placeholder="اكتب باختصار سبب زيارتك أو المشكلة التي تعاني منها..."></textarea>
      </div>

      <div class="form-group">
        <label>اليوم المفضل *</label>
        <!-- تم إضافة خاصية lang="ar" لضمان ظهور الروزنامة باللغة العربية حسب متصفح المريض -->
        <input type="date" id="appointmentDate" lang="ar" required>
      </div>

      <div class="form-group">
        <label>الوقت المفضل (من 9 صباحاً حتى 6 مساءً) *</label>
        <select id="appointmentTime" required>
          <option value="">-- اختر الوقت المناسب --</option>
          <option value="09:00 ص">09:00 صباحاً</option>
          <option value="10:00 ص">10:00 صباحاً</option>
          <option value="11:00 ص">11:00 صباحاً</option>
          <option value="12:00 م">12:00 ظهراً</option>
          <option value="01:00 م">01:00 بعد الظهر</option>
          <option value="02:00 م">02:00 بعد الظهر</option>
          <option value="03:00 م">03:00 عصراً</option>
          <option value="04:00 م">04:00 عصراً</option>
          <option value="05:00 م">05:00 مساءً</option>
          <option value="06:00 م">06:00 مساءً</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">تأكيد حجز الموعد</button>
    </form>

    <div id="message-box">
      <strong>تم استلام طلبك بنجاح!</strong><br>
      شكراً لثقتك بعيادة كيوان. تم تسجيل موعدك وسنتواصل معك قريباً جداً عبر الهاتف أو الواتساب لتأكيده نهائياً.
    </div>
  </div>
</main>

<footer>جميع الحقوق محفوظة © 2026 / عيادة كيوان لطب الأسنان</footer>

<script>
  // تحديد التاريخ الأدنى للسماح بالحجز من اليوم فصاعداً
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('appointmentDate').setAttribute('min', today);

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = {
      name: document.getElementById('patientName').value,
      birthYear: document.getElementById('birthYear').value,
      phone: document.getElementById('phoneNumber').value,
      complaint: document.getElementById('mainComplaint').value,
      date: document.getElementById('appointmentDate').value,
      time: document.getElementById('appointmentTime').value
    };

    document.getElementById('bookingForm').style.display = 'none';
    document.getElementById('message-box').style.display = 'block';
  });
</script>

</body>
</html>
