<main>
  <section class="booking-page-section">
    <div class="container">
      <div class="booking-card">
        <h3>حجز موعد في العيادة</h3>
        <p class="subtitle">أوقات العمل: من السبت إلى الخميس<br>(الساعات الكاملة من 9:00 صباحاً حتى 4:00 عصراً)</p>
        <div class="form-group"><label>الاسم الكامل:</label><input type="text" id="visitorName" placeholder="أدخل اسمك الكريم"></div>
        <div class="form-group"><label>رقم الهاتف:</label><input type="tel" id="visitorPhone" placeholder="مثال: 0956766617"></div>
        <div class="form-group"><label>تاريخ الموعد:</label><input type="date" id="visitorDate"></div>
        <div class="form-group"><label>اختر الساعة:</label>
          <select id="visitorHour">
            <option value="">اختر ساعة الدوام</option>
            <option value="09">09:00 صباحاً</option>
            <option value="10">10:00 صباحاً</option>
            <option value="11">11:00 صباحاً</option>
            <option value="12">12:00 ظهراً</option>
            <option value="13">01:00 ظهراً</option>
            <option value="14">02:00 عصراً</option>
            <option value="15">03:00 عصراً</option>
            <option value="16">04:00 عصراً</option>
          </select>
        </div>
        <div class="form-group"><label>سبب الزيارة:</label><input type="text" id="visitorNote" placeholder="مثال: كشف دوري"></div>
        <button class="booking-btn" onclick="sendBookingRequest()">تثبيت وإرسال حجز الموعد</button>
        <div id="booking-msg"></div>
        <div class="back-home">
          <a href="index.html">← العودة إلى الصفحة الرئيسية</a>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  async function sendBookingRequest() {
      const name = document.getElementById('visitorName').value.trim();
      const phone = document.getElementById('visitorPhone').value.trim();
      const dateInput = document.getElementById('visitorDate').value;
      const hourInput = document.getElementById('visitorHour').value;
      const msgDiv = document.getElementById('booking-msg');
      
      const scriptUrl = "https://script.google.com/macros/s/AKfycbyE4DM1qO_3dD5IOaFAt9adLHC2mSQ29XJ8qTzKyhUw0xnJNxLqlwcKKC601FY-kyCO/exec"; 

      if(!name || !phone || !dateInput || !hourInput) {
          msgDiv.style.color = "red";
          msgDiv.innerText = "الرجاء تعبئة كافة الحقول.";
          return;
      }

      const timeInput = dateInput + " " + hourInput + ":00";
      const selectedDate = new Date(dateInput);
      if (selectedDate.getDay() === 5) {
          msgDiv.style.color = "red";
          msgDiv.innerText = "عذراً، العيادة مغلقة يوم الجمعة.";
          return;
      }

      msgDiv.innerText = "جاري الحجز...";
      try {
          const response = await fetch(scriptUrl);
          const bookedTimes = await response.json();
          if (bookedTimes.includes(timeInput)) {
              msgDiv.style.color = "red";
              msgDiv.innerText = "عذراً، هذا الموعد محجوز مسبقاً.";
              return;
          }
          await fetch(scriptUrl, {
              method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, phone, time: timeInput, note: document.getElementById('visitorNote').value })
          });
          
          msgDiv.style.color = "green";
          msgDiv.innerText = "تم حجز موعدك بنجاح وسنؤكد لك قريباً!";
          document.getElementById('visitorName').value = "";
          document.getElementById('visitorPhone').value = "";
          document.getElementById('visitorDate').value = "";
          document.getElementById('visitorHour').value = "";
          document.getElementById('visitorNote').value = "";
      } catch(err) { msgDiv.style.color = "red"; msgDiv.innerText = "حدث خطأ، يرجى المحاولة لاحقاً."; }
  }
</script>
