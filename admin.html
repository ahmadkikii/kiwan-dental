<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة إدارة حالات عيادة كيوان</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .case-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; }
        button { cursor: pointer; padding: 5px 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>إدارة الحالات</h2>
        <div id="cases-list">جاري تحميل الحالات...</div>
        <hr>
        <h2>إضافة حالة جديدة</h2>
        <input type="text" id="title" placeholder="وصف الحالة">
        <input type="file" id="file">
        <button onclick="uploadCase()">رفع الحالة</button>
    </div>

    <script>
        const repo = "ahmadkikii/kiwan-dental";
        const token = localStorage.getItem('ghToken'); // تأكد من إدخال الرمز في المتصفح أولاً

        async function loadCases() {
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/assets/cases/cases-list.txt`, { headers: { 'Authorization': `token ${token}` }});
            const data = await res.json();
            const list = decodeURIComponent(escape(atob(data.content))).split('\n').filter(l => l.trim());
            const container = document.getElementById('cases-list');
            container.innerHTML = '';
            list.forEach((line, index) => {
                const div = document.createElement('div');
                div.className = 'case-item';
                div.innerHTML = `<span>${line}</span> <button onclick="deleteCase(${index})">حذف</button>`;
                container.appendChild(div);
            });
        }

        async function deleteCase(index) {
            // منطق الحذف: نقوم بقراءة الملف، مسح السطر، وإعادة رفعه
            // (سأكمل لك تفاصيل هذا الجزء في حال وافقت على هذا الهيكل)
            alert("تم إرسال طلب الحذف.. جاري التحديث");
        }
        
        loadCases();
    </script>
</body>
</html>
