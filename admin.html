<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة إدارة حالات عيادة كيوان</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .case-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; align-items: center; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
        input, select, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>لوحة إدارة الحالات</h2>
        <label>رمز الوصول (Personal Access Token):</label>
        <input type="password" id="token" placeholder="الصق الرمز هنا (ghp_...)">
        
        <h3>الحالات الحالية:</h3>
        <div id="cases-list">جاري التحميل...</div>

        <hr>
        <h3>إضافة حالة جديدة:</h3>
        <input type="text" id="newTitle" placeholder="وصف الحالة (مثال: علاج جذور لطفل...">
        <select id="newCategory">
            <option value="المداواة اللبية">المداواة اللبية</option>
            <option value="المداواة الترميمية">المداواة الترميمية</option>
            <option value="تجميل الأسنان">تجميل الأسنان</option>
            <option value="زرع الأسنان">زرع الأسنان</option>
            <option value="تقويم الأسنان">تقويم الأسنان</option>
            <option value="حالات أخرى">حالات أخرى</option>
        </select>
        <input type="file" id="newFile">
        <button onclick="addCase()">رفع وإضافة حالة</button>
    </div>

    <script>
        const repo = "ahmadkikii/kiwan-dental";
        
        async function loadCases() {
            const token = document.getElementById('token').value = localStorage.getItem('ghToken') || '';
            if(!token) { document.getElementById('cases-list').innerHTML = "الرجاء إدخال الرمز لتظهر الحالات"; return; }
            localStorage.setItem('ghToken', token);
            
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/assets/cases/cases-list.txt`, { headers: { 'Authorization': `token ${token}` }});
            if(!res.ok) { document.getElementById('cases-list').innerHTML = "لا توجد حالات حالياً."; return; }
            const data = await res.json();
            const content = decodeURIComponent(escape(atob(data.content)));
            const lines = content.split('\n').filter(l => l.trim());
            
            const listDiv = document.getElementById('cases-list');
            listDiv.innerHTML = '';
            lines.forEach((line, index) => {
                const parts = line.split('|');
                const title = parts[2] ? parts[2].trim() : parts[1].trim();
                const cat = parts[2] ? `[${parts[1].trim()}]` : '';
                const div = document.createElement('div');
                div.className = 'case-item';
                div.innerHTML = `<span>${cat} ${title}</span> <button class="delete-btn" onclick="deleteCase(${index})">حذف</button>`;
                listDiv.appendChild(div);
            });
        }

        async function deleteCase(index) {
            const token = document.getElementById('token').value;
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/assets/cases/cases-list.txt`, { headers: { 'Authorization': `token ${token}` }});
            const data = await res.json();
            let lines = decodeURIComponent(escape(atob(data.content))).split('\n').filter(l => l.trim());
            
            lines.splice(index, 1);
            const newContent = btoa(unescape(encodeURIComponent(lines.join('\n') + '\n')));
            
            await fetch(`https://api.github.com/repos/${repo}/contents/assets/cases/cases-list.txt`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Delete case", content: newContent, sha: data.sha })
            });
            alert("تم الحذف بنجاح!");
            loadCases();
        }

        async function addCase() {
            const token = document.getElementById('token').value;
            const title = document.getElementById('newTitle').value;
            const category = document.getElementById('newCategory').value;
            const file = document.getElementById('newFile').files[0];
            if(!file || !title) return alert("الرجاء اختيار صورة وكتابة وصف الحالة");
            
            const reader = new FileReader();
            reader.onloadend = async () => {
                const fileName = "case-" + Date.now() + ".jpg";
                // رفع الصورة
                await fetch(`https://api.github.com/repos/${repo}/contents/assets/cases/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Add case image", content: reader.result.split(',')[1] })
                });
                
                // جلب القائمة القديمة
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/assets/cases/cases-list.txt`, { headers: { 'Authorization': `token ${token}` }});
                const data = res.ok ? await res.json() : null;
                const content = data ? decodeURIComponent(escape(atob(data.content))) : "";
                
                // إضافة السطر الجديد بالنسق: file.jpg | القسم | الوصف
                const newEntry = `${fileName} | ${category} | ${title}\n`;
                const newContent = btoa(unescape(encodeURIComponent(content + newEntry)));
                
                await fetch(`https://api.github.com/repos/${repo}/contents/assets/cases/cases-list.txt`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Update cases list", content: newContent, sha: data ? data.sha : undefined })
                });
                alert("تم رفع الإضافة بنجاح!");
                loadCases();
            };
            reader.readAsDataURL(file);
        }
        
        document.getElementById('token').onchange = loadCases;
        loadCases();
    </script>
</body>
</html>
