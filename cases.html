<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>معرض الحالات الكامل | عيادة كيوان</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .cases-page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 40px 0; }
    .case-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .case-card img { width: 100%; height: 300px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: 0.3s; opacity: 1 !important; }
    #modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
    #modal img { max-width: 90%; max-height: 80%; border-radius: 5px; }
  </style>
</head>
<body>

<header class="site-header"><div class="container"><nav class="nav"><a href="index.html">الرجوع للرئيسية</a></nav></div></header>

<main class="container">
  <div id="cases-grid" class="cases-page-grid"></div>
</main>

<div id="modal" onclick="this.style.display='none'"><img id="modal-img"></div>

<script>
  fetch('assets/cases/cases-list.txt?t=' + Date.now())
    .then(res => res.text()).then(data => {
      const grid = document.getElementById('cases-grid');
      data.split('\n').filter(l => l.trim()).forEach(line => {
        const [file, title] = line.split('|');
        grid.innerHTML += `
          <article class="case-card">
            <img src="assets/cases/${file.trim()}" onclick="document.getElementById('modal-img').src=this.src; document.getElementById('modal').style.display='flex'">
            <h3 style="margin-top:15px;">${title ? title.trim() : 'حالة طبية'}</h3>
          </article>`;
      });
    });
</script>
</body>
</html>
