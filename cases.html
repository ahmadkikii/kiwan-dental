<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>معرض الحالات العلاجية - عيادة كيوان</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .case-section { margin-bottom: 50px; }
    .section-title { font-size: 1.5rem; color: #03263b; margin-bottom: 20px; border-right: 4px solid #3498db; padding-right: 15px; }
    .cases-slider { display: flex; overflow-x: auto; gap: 20px; padding: 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
    .case-thumb-card { min-width: 250px; scroll-snap-align: start; background: #fff; padding: 10px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
    .case-thumb-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: 0.3s; opacity: 1; }
    .case-thumb-card img:hover { transform: scale(1.03); }
    .case-thumb-card p { margin-top: 10px; font-size: 0.9rem; color: #333; font-weight: 500; height: 3em; overflow: hidden; }
    
    /* مودال التكبير */
    #modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
    #modal img { max-width: 90%; max-height: 80%; border-radius: 5px; }
  </style>
</head>
<body>

<div class="container" id="cases-container">
  <h1>معرض الحالات العلاجية</h1>
  <div id="content">جاري تحميل الحالات...</div>
</div>

<div id="modal" onclick="this.style.display='none'"><img id="modal-img"></div>

<script>
  fetch('assets/cases/cases-list.txt?t=' + new Date().getTime())
    .then(res => res.text())
    .then(data => {
      const content = document.getElementById('content');
      let lines = data.split('\n').filter(l => l.trim());
      lines.reverse(); // من الأحدث للأقدم

      // تجميع الحالات حسب القسم
      const grouped = {};
      lines.forEach(line => {
        const [file, cat, title] = line.split('|').map(s => s.trim());
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push({file, title});
      });

      content.innerHTML = '';
      for (const cat in grouped) {
        let section = `<div class="case-section">
          <h2 class="section-title">${cat}</h2>
          <div class="cases-slider">`;
        
        grouped[cat].forEach(item => {
          section += `
            <div class="case-thumb-card">
              <img src="assets/cases/${item.file}" onclick="document.getElementById('modal-img').src=this.src; document.getElementById('modal').style.display='flex'">
              <p>${item.title}</p>
            </div>`;
        });
        
        section += `</div></div>`;
        content.innerHTML += section;
      }
    });
</script>
</body>
</html>
