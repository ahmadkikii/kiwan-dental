<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حالات عيادة كيوان</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 50px; }
        .case-card img { width: 100%; cursor: pointer; transition: transform 0.3s; }
        .case-card img:hover { transform: scale(1.05); }
        /* نافذة تكبير الصورة */
        #modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        #modal img { max-width: 90%; max-height: 90%; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>شاهد حالاتنا</h1>
        <div id="cases-grid" class="cases-grid"></div>
    </div>
    <div id="modal" onclick="this.style.display='none'"><img src="" id="modal-img"></div>

    <script>
        fetch('assets/cases/cases-list.txt?t=' + new Date().getTime())
        .then(res => res.text()).then(data => {
            const grid = document.getElementById('cases-grid');
            data.split('\n').filter(l => l.trim()).forEach(line => {
                const [file, title] = line.split('|');
                const card = document.createElement('div');
                card.className = 'case-card';
                card.innerHTML = `<img src="assets/cases/${file.trim()}" onclick="openModal(this.src)"><h3>${title}</h3>`;
                grid.appendChild(card);
            });
        });
        function openModal(src) { document.getElementById('modal-img').src = src; document.getElementById('modal').style.display = 'flex'; }
    </script>
</body>
</html>
