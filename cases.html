<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معرض الحالات العلاجية | عيادة كيوان</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .category-section { margin-bottom: 50px; }
    .category-title { font-size: 1.6rem; color: #03263b; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-bottom: 25px; }
    .cases-page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
    .case-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; }
    .case-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .case-card img:hover { transform: scale(1.02); }
    #modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
    #modal img { max-width: 90%; max-height: 80%; border-radius: 5px; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html"><span><strong>عيادة كيوان</strong><small>لطب الأسنان</small></span></a>
    <nav class="nav">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#services">خدماتنا</a>
      <a class="active" href="cases.html">معرض الحالات</a>
      <a href="index.html#contact">تواصل معنا</a>
    </nav>
  </div>
</header>

<main class="container" style="padding: 50px 0;">
  <div class="section-title"><h2>معرض الحالات العلاجية</h2><span></span></div>
  
  <div id="all-categories-container">
    <p id="status" style="text-align: center; color: #666; padding: 40px;">جاري تحميل الحالات...</p>
  </div>
</main>

<div id="modal" onclick="this.style.display='none'"><img id="modal-img"></div>

<footer style="text-align: center; padding: 30px; background: #03263b; color: white; margin-top: 50px;">
  جميع الحقوق محفوظة © 2026 / عيادة كيوان لطب الأسنان
</footer>

<script>
  const categories = ["المداواة اللبية", "المداواة الترميمية", "تجميل الأسنان", "زرع الأسنان", "تقويم الأسنان", "حالات أخرى"];

  fetch('assets/cases/cases-list.txt?t=' + Date.now())
    .then(res => res.text())
    .then(data => {
      const container = document.getElementById('all-categories-container');
      const lines = data.split('\n').filter(l => l.trim());
      
      if(lines.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #888;">لا توجد حالات معروضة حالياً.</p>';
        return;
      }
      
      container.innerHTML = '';
      
      // تجميع الحالات حسب التصنيف
      const categorized = {};
      categories.forEach(cat => categorized[cat] = []);
      
      lines.forEach(line => {
        const parts = line.split('|');
        if(parts.length >= 3) {
          const file = parts[0].trim();
          const cat = parts[1].trim();
          const title = parts[2].trim();
          if(categorized[cat]) {
            categorized[cat].push({file, title});
          } else {
            categorized["حالات أخرى"].push({file, title});
          }
        } else if(parts.length === 2) {
          // متوافق مع البيانات القديمة إن وجدت
          categorized["حالات أخرى"].push({file: parts[0].trim(), title: parts[1].trim()});
        }
      });
      
      // بناء الأقسام في الصفحة
      categories.forEach(cat => {
        const items = categorized[cat];
        if(items.length > 0) {
          let sectionHTML = `
            <div class="category-section">
              <h3 class="category-title">${cat}</h3>
              <div class="cases-page-grid">`;
          
          items.forEach(item => {
            sectionHTML += `
              <article class="case-card">
                <img src="assets/cases/${item.file}" onclick="document.getElementById('modal-img').src=this.src; document.getElementById('modal').style.display='flex'" alt="${item.title}">
                <h4 style="margin-top:15px; color:#333; font-size: 1.05rem;">${item.title}</h4>
              </article>`;
          });
          
          sectionHTML += `</div></div>`;
          container.innerHTML += sectionHTML;
        }
      });
    })
    .catch(err => {
      document.getElementById('all-categories-container').innerText = "حدث خطأ في تحميل الحالات.";
    });
</script>
</body>
</html>
