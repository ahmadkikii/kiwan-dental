<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03263b">
  <meta name="description" content="معرض الحالات العلاجية - عيادة كيوان لطب الأسنان">
  <title>معرض الحالات العلاجية - عيادة كيوان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .cases-page-section { padding: 40px 0; border-bottom: 1px solid #eee; }
    .cases-page-section h2 { font-size: 1.6rem; color: #03263b; margin-bottom: 20px; border-right: 4px solid #3498db; padding-right: 12px; }
    .cases-slider { display: flex; overflow-x: auto; gap: 20px; padding: 10px 5px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
    .cases-slider::-webkit-scrollbar { height: 8px; }
    .cases-slider::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    .case-thumb-card { min-width: 260px; max-width: 260px; scroll-snap-align: start; background: #fff; padding: 12px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.06); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .case-thumb-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .case-thumb-card img:hover { transform: scale(1.02); }
    .case-thumb-card p { margin-top: 12px; font-size: 0.9rem; color: #333; font-weight: 600; line-height: 1.4; max-height: 4.2em; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    
    /* مودال التكبير */
    #modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
    #modal img { max-width: 90%; max-height: 80%; border-radius: 5px; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html" aria-label="عيادة كيوان لطب الأسنان">
      <span class="brand-text"><strong>عيادة كيوان</strong><small>لطب الأسنان</small></span>
      <span class="tooth-logo" aria-hidden="true">♡</span>
    </a>
    <nav class="nav">
      <a href="index.html">الرئيسية</a>
      <a class="active" href="cases.html">معرض الحالات</a>
    </nav>
    <a class="btn btn-primary nav-appointment" href="index.html#contact">▣ &nbsp; احجز موعد</a>
  </div>
</header>

<main class="container" style="padding-top: 30px; padding-bottom: 50px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
    <div>
      <h1 style="color: #03263b; font-size: 2rem; margin-bottom: 5px;">معرض الحالات العلاجية</h1>
      <p style="color: #666;">تصفح نتائج العمل الطبي والتجميلي موزعة حسب التخصصات</p>
    </div>
    <a href="index.html" class="btn btn-outline" style="border: 1px solid #03263b; color: #03263b; padding: 8px 20px; border-radius: 6px; text-decoration: none; font-weight: 600;">← العودة للرئيسية</a>
  </div>

  <div id="cases-content">
    <p style="text-align: center; color: #888; padding: 40px;">جاري تحميل الحالات...</p>
  </div>
</main>

<div id="modal" onclick="this.style.display='none'"><img id="modal-img"></div>

<footer>جميع الحقوق محفوظة © 2026 / عيادة كيوان لطب الأسنان</footer>

<script src="script.js?v=20260813"></script>
<script>
  fetch('assets/cases/cases-list.txt?t=' + new Date().getTime())
    .then(res => res.text())
    .then(data => {
      const container = document.getElementById('cases-content');
      let lines = data.split('\n').filter(l => l.trim());
      
      if(lines.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #888; padding: 40px;">لا توجد حالات مضافة حالياً.</p>';
        return;
      }
      
      // عكس الترتيب لتظهر الحالات من الأحدث إلى الأقدم
      lines.reverse();

      // تجميع الحالات حسب القسم
      const categories = {};
      lines.forEach(line => {
        const parts = line.split('|');
        if(parts.length >= 2) {
          const file = parts[0].trim();
          const cat = parts[1].trim();
          const title = parts[2] ? parts[2].trim() : cat;
          
          if(!categories[cat]) categories[cat] = [];
          categories[cat].push({ file, title });
        }
      });

      container.innerHTML = '';
      for(const cat in categories) {
        let sectionHTML = `
          <section class="cases-page-section">
            <h2>${cat}</h2>
            <div class="cases-slider">`;
        
        categories[cat].forEach(item => {
          sectionHTML += `
            <div class="case-thumb-card">
              <img src="assets/cases/${item.file}" alt="${item.title}" onclick="document.getElementById('modal-img').src=this.src; document.getElementById('modal').style.display='flex'">
              <p>${item.title}</p>
            </div>`;
        });
        
        sectionHTML += `</div></section>`;
        container.innerHTML += sectionHTML;
      }
    })
    .catch(err => {
      console.error(err);
      document.getElementById('cases-content').innerHTML = '<p style="text-align: center; color: #e74c3c;">تعذر تحميل الحالات حالياً.</p>';
    });
</script>
</body>
</html>
