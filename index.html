<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عيادة كيوان لطب الأسنان</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .cases-cta { background: #f8f9fa; padding: 60px 0; text-align: center; }
    .cases-slider { display: flex; overflow-x: auto; gap: 20px; padding: 20px 0; scroll-snap-type: x mandatory; }
    .case-thumb { min-width: 250px; scroll-snap-align: start; text-align: center; }
    .case-thumb img { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; opacity: 0.7; transition: 0.3s; }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="#home"><span><strong>عيادة كيوان</strong></span></a>
    <nav class="nav">
      <a class="active" href="#home">الرئيسية</a>
      <a href="#services">خدماتنا</a>
      <a href="cases.html">معرض الحالات</a>
      <a href="#contact">تواصل معنا</a>
    </nav>
  </div>
</header>

<main>
  <!-- Hero Section -->
  <section class="hero"><div class="container hero-content"><h1>عيادة كيوان</h1><p>نعتني بابتسامتك</p></div></section>

  <!-- Slider Section -->
  <section class="cases-cta">
    <div class="container">
      <h2>شاهد نتائجنا المتميزة</h2>
      <div id="index-cases-slider" class="cases-slider"></div>
      <div style="margin-top: 30px;"><a class="btn btn-primary" href="cases.html">تصفح كامل المعرض ◰</a></div>
    </div>
  </section>
</main>

<script>
  fetch('assets/cases/cases-list.txt?t=' + Date.now())
    .then(res => res.text()).then(data => {
      const slider = document.getElementById('index-cases-slider');
      const lines = data.split('\n').filter(l => l.trim());
      lines.forEach(line => {
        const [file, title] = line.split('|');
        slider.innerHTML += `
          <div class="case-thumb">
            <img src="assets/cases/${file.trim()}">
            <p style="margin-top:8px; font-size:0.9rem;">${title ? title.trim() : 'حالة طبية'}</p>
          </div>`;
      });
    });
</script>
</body>
</html>
