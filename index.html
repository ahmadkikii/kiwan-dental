<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادة كيوان لطب الأسنان - دمشق</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #03263b;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        header h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }
        header p {
            margin: 0;
            color: #bdc3c7;
            font-size: 0.95rem;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .patient-booking-section {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e1e8ed;
        }
        .patient-booking-section h3 {
            color: #03263b;
            text-align: center;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #2c3e50;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #27ae60;
        }
        button {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #219653;
        }
        #booking-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>عيادة كيوان لطب الأسنان</h1>
        <p>دمشق - بحصة | الرعاية المتقدمة لصحة أسنانك</p>
    </header>

    <div class="container">
        <div class="patient-booking-section">
            <h3>حجز موعد جديد</h3>
            <p style="font-size: 0.85rem; color: #666; text-align: center; margin-bottom: 20px;">
                اختر الموعد المناسب وسيتم تسجيله مباشرة في النظام لتأكيده.
            </p>
            
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" id="visitorName" placeholder="أدخل اسمك الكريم">
            </div>
            
            <div class="form-group">
                <label>رقم الهاتف (للتواصل):</label>
                <input type="tel" id="visitorPhone" placeholder="رقم الهاتف أو الواتساب">
            </div>

            <div class="form-group">
                <label>وقت الموعد المرغوب:</label>
                <input type="datetime-local" id="visitorTime">
            </div>
            
            <div class="form-group">
                <label>سبب الزيارة أو ملاحظة:</label>
                <input type="text" id="visitorNote" placeholder="مثال: ألم في الضرس / كشف دوري">
            </div>
            
            <button onclick="sendBookingRequest()">تثبيت حجز الموعد</button>
            <div id="booking-msg"></div>
        </div>
    </div>

    <script>
        async function sendBookingRequest() {
            const name = document.getElementById('visitorName').value.trim();
            const phone = document.getElementById('visitorPhone').value.trim();
            const time = document.getElementById('visitorTime').value;
            const note = document.getElementById('visitorNote').value.trim();
            const msgDiv = document.getElementById('booking-msg');

            if(!name || !phone || !time) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "الرجاء إدخال الاسم، رقم الهاتف، ووقت الموعد.";
                return;
            }

            msgDiv.style.color = "#333";
            msgDiv.innerText = "جاري إرسال طلب الحجز...";

            try {
                // رابط السكربت الآمن الخاص بك
                const scriptUrl = "https://script.google.com/macros/s/AKfycbzfVEU6McvMu69_uDU-dLIrhER7kvkjnrl4pmMhZvifwiIt4tI7zHcukBpOLs08p1Cv/exec"; 

                const data = { name, phone, time, note };

                await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                msgDiv.style.color = "green";
                msgDiv.innerText = "تم إرسال طلب الحجز بنجاح! سنقوم بالتواصل معك لتأكيد الموعد.";
                
                // تفريغ الحقول بعد الإرسال
                document.getElementById('visitorName').value = "";
                document.getElementById('visitorPhone').value = "";
                document.getElementById('visitorTime').value = "";
                document.getElementById('visitorNote').value = "";

            } catch(err) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.";
            }
        }
    </script>
</body>
</html>
